name: SOC Job Hunter

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jobbot
  cancel-in-progress: false

jobs:
  jobbot:
    runs-on: ubuntu-latest

    steps:
      # =====================================================
      # CHECKOUT
      # =====================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # =====================================================
      # PYTHON
      # =====================================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # =====================================================
      # DEPENDENCIES
      # =====================================================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      # =====================================================
      # DATABASE STATUS
      # =====================================================
      - name: Check database
        run: |
          if [ -f jobs.db ]; then
            echo "Database found."
            ls -lh jobs.db
          else
            echo "No database found. Starting fresh."
          fi

      # =====================================================
      # RUN JOBBOT
      # =====================================================
      - name: Run JobBot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python job_sources.py

      # =====================================================
      # SAVE DATABASE
      # =====================================================
      - name: Commit database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ ! -f jobs.db ]; then
            echo "ERROR: jobs.db was not created."
            exit 1
          fi

          git add jobs.db

          if git diff --cached --quiet; then
            echo "No database changes."
          else
            git commit -m "Update job database"
            git push origin HEAD:main
          fi
